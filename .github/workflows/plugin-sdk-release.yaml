name: Publish Plugin SDK Package

on:
  workflow_dispatch:
    inputs:
      publish_package:
        description: Publish @starcyrene/cyrene-name-roller to GitHub Packages
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'plugin-sdk-v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-plugin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@starcyrene'

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run plugin:sdk:pack

      # ── 发布到 GitHub Packages ──
      - name: Publish SDK to GitHub Packages
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_package) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-sdk-v'))
        working-directory: packages/cyrene-name-roller
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --registry=https://npm.pkg.github.com --access public

      # ── 发布到 npmjs（OIDC Trusted Publishing）──
      - name: Publish SDK to npmjs
        working-directory: packages/cyrene-name-roller
        run: |
          npm config delete //npm.pkg.github.com/:_authToken 2>/dev/null || true
          npm config set @starcyrene:registry https://registry.npmjs.org
          npm publish --registry=https://registry.npmjs.org --access public --provenance
