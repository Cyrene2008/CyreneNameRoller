name: Publish Plugin SDK Package

on:
  workflow_dispatch:
    inputs:
      publish_package:
        description: Publish @starcyrene/cyrene-name-roller to package registries
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'plugin-sdk-v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-plugin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          scope: '@starcyrene'

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run plugin:sdk:pack

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-sdk-package
          path: build-output/plugin-sdk/

      # ── 发布到 GitHub Packages ──
      - name: Publish SDK to GitHub Packages
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_package) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-sdk-v'))
        run: npm publish build-output/plugin-sdk/cyrene-name-roller-plugin-sdk-*.tgz --registry=https://npm.pkg.github.com

      # ── 发布到 npmjs（OIDC Trusted Publishing）──
      - name: Publish SDK to npmjs
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_package) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-sdk-v'))
        run: npm publish build-output/plugin-sdk/cyrene-name-roller-plugin-sdk-*.tgz --registry=https://registry.npmjs.org --provenance
