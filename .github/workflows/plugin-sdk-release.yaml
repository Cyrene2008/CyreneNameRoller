name: Publish Plugin SDK Package

on:
  workflow_dispatch:
    inputs:
      publish_package:
        description: Publish @starcyrene/cyrene-name-roller to npmjs
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'plugin-sdk-v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-plugin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run plugin:sdk:pack

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-sdk-package
          path: build-output/plugin-sdk/

      # ── 发布到 npmjs（OIDC Trusted Publishing）──
      # npm ≥ 11.5.1 才支持 OIDC 可信发布认证；Node 22 自带的 npm 10.x 仅能签名
      # provenance 但无法完成发布认证（表现为 PUT 404）。同时不要在 setup-node
      # 配置 registry-url，否则 .npmrc 中的占位 token 会屏蔽 OIDC 流程。
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Publish SDK to npmjs
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_package) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-sdk-v'))
        run: npm publish build-output/plugin-sdk/cyrene-name-roller-plugin-sdk-*.tgz --registry=https://registry.npmjs.org --access public --provenance
