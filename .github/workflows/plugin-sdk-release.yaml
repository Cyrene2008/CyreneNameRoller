name: Publish Plugin SDK Package

on:
  workflow_dispatch:
    inputs:
      publish_package:
        description: Publish @starcyrene/cyrene-name-roller to package registries
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'plugin-sdk-v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-plugin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@starcyrene'

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run plugin:sdk:pack

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-sdk-package
          path: build-output/plugin-sdk/

      # ── 发布到 GitHub Packages ──
      - name: Publish SDK to GitHub Packages
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_package) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-sdk-v'))
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish build-output/plugin-sdk/cyrene-name-roller-plugin-sdk-*.tgz --registry=https://npm.pkg.github.com --access public --provenance=false

      # ── 发布到 npmjs（OIDC Trusted Publishing）──
      - name: Publish SDK to npmjs
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_package) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-sdk-v'))
        run: npm publish build-output/plugin-sdk/cyrene-name-roller-plugin-sdk-*.tgz --registry=https://registry.npmjs.org --access public --provenance
