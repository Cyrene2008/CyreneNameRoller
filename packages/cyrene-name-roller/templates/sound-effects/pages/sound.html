<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音效</title><style>:root{color-scheme:light dark;font-family:"Segoe UI Variable",system-ui,sans-serif}body{margin:0;padding:24px;color:CanvasText;background:Canvas}.card{max-width:720px;padding:18px;border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:14px}.row{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid color-mix(in srgb,CanvasText 14%,transparent)}button,select,input{font:inherit}button{padding:7px 10px;border-radius:8px;border:1px solid color-mix(in srgb,CanvasText 24%,transparent);background:Canvas;color:inherit}.file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:GrayText;font-size:12px}</style></head><body><div class="card"><h1>音效</h1><div class="row"><label>启用</label><span></span><input id="enabled" type="checkbox"></div><div class="row"><label>音量</label><input id="volume" type="range" min="0" max="1" step="0.01"><output id="volumeValue"></output></div><div class="row"><label>播放逻辑</label><select id="mode"><option value="once">每次操作一次</option><option value="each">每个结果一次</option></select><span></span></div><div id="audioRows"></div></div><script>const request=window.CyrenePlugin.request;const state={enabled:true,volume:.7,playbackMode:'once',roller:null,card:null,lottery:null};const labels={roller:'随机点名',card:'翻牌点名',lottery:'抽奖'};const rows=document.getElementById('audioRows');for(const kind of Object.keys(labels)){const row=document.createElement('div');row.className='row';row.innerHTML=`<label>${labels[kind]}</label><span class="file" id="${kind}Name">未选择</span><button data-kind="${kind}">选择音频</button>`;rows.append(row)}async function save(next){Object.assign(state,next);await request('storage.write',{key:'settings',value:state})}async function load(){Object.assign(state,(await request('storage.read',{key:'settings'}))||{});enabled.checked=!!state.enabled;volume.value=state.volume;volumeValue.textContent=Math.round(state.volume*100)+'%';mode.value=state.playbackMode;for(const kind of Object.keys(labels))document.getElementById(kind+'Name').textContent=state[kind]?.name||'未选择'}enabled.onchange=()=>save({enabled:enabled.checked});volume.oninput=()=>{volumeValue.textContent=Math.round(volume.value*100)+'%';save({volume:Number(volume.value)})};mode.onchange=()=>save({playbackMode:mode.value});document.querySelectorAll('button').forEach(button=>button.onclick=async()=>{const kind=button.dataset.kind;const file=await request('audio.select',{});if(file){document.getElementById(kind+'Name').textContent=file.name;await save({[kind]:file})}});load()</script></body></html>
